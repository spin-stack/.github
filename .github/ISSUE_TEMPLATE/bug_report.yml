name: Bug report
description: Something does not work as documented.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Security problems go through private reporting in the Security tab, not here.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      description: The smallest set of steps that shows the problem.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Release tag (for example v20261024.01) or commit.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant output. Remove secrets first.
      render: text
